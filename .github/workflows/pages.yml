name: Deploy documentation site

# The legacy branch build stopped completing reliably, so the site is built and
# published here instead. Permissions are narrowed to exactly what Pages needs:
# this workflow publishes the site and nothing else.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the Jekyll site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Check public documentation routes and privacy
        run: |
          for page in index.html features/index.html plugins/index.html plugin-development/index.html install/index.html overview/index.html build/index.html licensing/index.html panes/index.html sessions/index.html shortcuts/index.html preferences/index.html; do
            test -s "_site/$page" || exit 1
          done
          if grep -R -n -E '/tmp/opencode|/home/me/|Among-Terminal/ci-probe|sync-docs\.py|refresh-public-docs\.mjs' _site --include='*.html'; then
            echo 'Internal material found in the public site' >&2
            exit 1
          fi
      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
