<svg xmlns="http://www.w3.org/2000/svg" width="420" height="890" viewBox="0 0 420 890" role="img" aria-labelledby="title description">
  <title id="title">Installing and enabling a plugin</title>
  <desc id="description">Confirm installation, download and verify the package, then leave it installed and disabled. Turn it on, review required and optional access, and accept access. Among checks protection and startup before the plugin runs. A failed check stops that step and shows a reason. Reduced protection requires separate consent.</desc>
  <rect width="420" height="890" fill="#20262f"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fdae02"/>
    </marker>
  </defs>
  <g fill="none" stroke="#fdae02" stroke-width="2" marker-end="url(#arrow)">
    <path d="M210 112V144"/>
    <path d="M210 218V250"/>
    <path d="M210 324V356"/>
    <path d="M210 430V462"/>
    <path d="M210 536V568"/>
    <path d="M210 664V696"/>
  </g>
  <g fill="#20262f" stroke="#aeb3ba" stroke-width="1.5">
    <rect x="24" y="38" width="372" height="74"/>
    <rect x="24" y="144" width="372" height="74"/>
    <rect x="24" y="356" width="372" height="74"/>
    <rect x="24" y="462" width="372" height="74"/>
    <rect x="24" y="568" width="372" height="96"/>
  </g>
  <g fill="#fdae02">
    <rect x="24" y="250" width="372" height="74"/>
    <rect x="24" y="696" width="372" height="74"/>
  </g>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">
    <text x="210" y="69">Choose an available plugin</text>
    <text x="210" y="96">Confirm installation</text>
    <text x="210" y="188">Download and verify package</text>
    <text x="210" y="294" fill="#20262f">Installed and disabled</text>
    <text x="210" y="387">Turn on the plugin</text>
    <text x="210" y="414">Review requested access</text>
    <text x="210" y="493">Accept required access</text>
    <text x="210" y="520">Choose optional access</text>
    <text x="210" y="600">Check protection and startup</text>
    <text x="210" y="628" font-size="18">Reduced protection needs</text>
    <text x="210" y="651" font-size="18">separate consent</text>
    <text x="210" y="740" fill="#20262f">Running</text>
    <text x="210" y="817" font-size="18">A failed check stops that step.</text>
    <text x="210" y="845" font-size="18">Settings shows the reason.</text>
  </g>
</svg>
